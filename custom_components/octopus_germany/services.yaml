set_device_preferences:
  name: Set device preferences
  description: Set charging preferences for an electric vehicle device using the new API
  fields:
    device_id:
      name: Vehicle or Charge Point
      description: Choose by name from the dropdown. In YAML, use either the Home Assistant device registry ID or the Octopus device UUID; Home Assistant IDs are resolved automatically.
      required: true
      selector:
        device:
          filter:
            - integration: octopus_germany
          entity:
            - domain: binary_sensor
              device_class: plug
              integration: octopus_germany
    target_percentage:
      name: Target state of charge
      description: Target state of charge (20-100% in 5% steps)
      required: true
      default: 80
      example: 80
      selector:
        number:
          min: 20
          max: 100
          step: 5
    target_time:
      name: Target time
      description: Target time for charging (04:00-17:00)
      required: true
      default: "06:00"
      example: "06:00"
      selector:
        time:

refresh_intelligent_data:
  name: Refresh Intelligent data
  description: Request an immediate refresh of Intelligent device and dispatch data.

get_smart_meter_readings:
  name: Get Smart Meter Readings
  description: Fetch smart meter readings for a specific date (historical). Results are returned in the service response and as event `octopus_germany_smart_meter_readings_result` (subscribe via Developer Tools → Events).
  fields:
    account_number:
      name: Account Number
      description: The account number (usually starts with A-)
      required: true
      example: "A-12345678"
      selector:
        text:
    date:
      name: Date
      description: Date for readings (YYYY-MM-DD format, data available 2+ days ago)
      required: true
      example: "2025-10-08"
      selector:
        date:
    property_id:
      name: Property ID
      description: Property ID (optional, will use first property if not specified)
      required: false
      example: "123456"
      selector:
        text:

export_smart_meter_csv:
  name: Export Smart Meter Data to CSV
  description: Export smart meter data for a month or year to CSV using paginated monthly range requests in the Home Assistant timezone. Choose 15-minute or hourly readings and wide or tall layout. Files are saved under /config/octopus_germany/exports and a persistent Home Assistant notification provides a browser-download link valid for 30 days. The response includes meter-assignment and quality metadata and is also fired as event `octopus_germany_csv_export_result`.
  fields:
    account_number:
      name: Account Number
      description: The account number (usually starts with A-)
      required: true
      example: "A-12345678"
      selector:
        text:
    property_id:
      name: Property ID
      description: Property ID (optional, will use first property if not specified)
      required: false
      example: "123456"
      selector:
        text:
    period:
      name: Period
      description: Export monthly or yearly data
      required: true
      default: "month"
      example: "month"
      selector:
        select:
          options:
            - "month"
            - "year"
    year:
      name: Year
      description: Year for the export (YYYY format)
      required: true
      example: 2025
      selector:
        number:
          min: 2020
          max: 2030
          mode: box
    month:
      name: Month
      description: Month for the export (1-12, only for monthly period)
      required: false
      example: 1
      selector:
        number:
          min: 1
          max: 12
          mode: box
    filename:
      name: Filename
      description: Output filename (without extension, saved under /config/octopus_germany/exports; leave empty to auto-generate octopus_<account>_<year>[_<month>].csv)
      required: false
      example: "octopus_export"
      selector:
        text:
    layout:
      name: Layout
      description: "Table layout: wide (days as columns) or tall (days as rows)"
      required: false
      default: "wide"
      selector:
        select:
          options:
            - "wide"
            - "tall"
    resolution:
      name: Resolution
      description: "Reading resolution: 15-minute readings or hourly readings"
      required: false
      default: "15min"
      selector:
        select:
          options:
            - "15min"
            - "hour"
    summary:
      name: Add Summary
      description: "Add a per-day summary section (total kWh and optional GO/Standard split)"
      required: false
      default: false
      selector:
        boolean:
    go_window_start:
      name: GO Window Start
      description: Optional start time for GO window (HH:MM, used for summary split)
      required: false
      example: "00:30"
      selector:
        time:
    go_window_end:
      name: GO Window End
      description: Optional end time for GO window (HH:MM, used for summary split)
      required: false
      example: "04:30"
      selector:
        time:

export_cost_report:
  name: Export electricity cost report
  description: Create a cost CSV or an offline XLSX and quarter-hour measurement CSV package from agreement prices, smart-meter readings, and variable grid fees. The service checks /config/octopus_germany/grid_fee_schedules.json for the detected network-operator code and report year and, when needed, each agreement's start year; omitted contract-start network charge uses its unique date-valid basis_rate_net_ct_per_kwh. If schedules are missing or unmatched, the service response warns that the file can be created from docs/examples/grid_fee_schedules.example.json. API rates take precedence, followed by explicit service rates and matching file rates. Files are saved under /config/octopus_germany/exports with a browser-download notification.
  fields:
    format:
      name: Export format
      description: "csv keeps the existing cost CSV. package creates an editable offline XLSX and an exact quarter-hour measurement CSV from one measurement fetch, with two download links and no additional cost CSV."
      required: false
      default: csv
      selector:
        select:
          options:
            - csv
            - package
    network_comparison:
      name: Module 3 comparison basis
      description: "XLSX only: compare with the contract-start grid fee or the documented normal fee for the report year. Does not change effective costs."
      required: false
      default: contract_start
      selector:
        select:
          options:
            - contract_start
            - current_year
    standard_network_charge_ct_kwh:
      name: Normal annual grid fee (net ct/kWh)
      description: "Required for package comparison current_year. Enter the documented normal annual fee, not the ST band of Module 3. Also used for package intervals before Module 3 applies; without it, a variable ST band cannot substitute for the normal fee."
      required: false
      selector:
        number:
          min: 0
          max: 100
          step: any
          mode: box
    account_number:
      name: Account Number
      description: The account number (usually starts with A-)
      required: true
      example: "A-12345678"
      selector:
        text:
    property_id:
      name: Property ID
      description: Property ID (optional, uses the first account property otherwise)
      required: false
      selector:
        text:
    period:
      name: Period
      description: Export a month or a calendar year (current year ends two days ago)
      required: true
      default: "month"
      selector:
        select:
          options:
            - "month"
            - "year"
    year:
      name: Year
      description: Calendar year to report
      required: true
      example: 2026
      selector:
        number:
          min: 2020
          max: 2035
          mode: box
    month:
      name: Month
      description: Required for monthly reports (1-12)
      required: false
      selector:
        number:
          min: 1
          max: 12
          mode: box
    contract_start_network_charge_ct_kwh:
      name: Contract-start network charge
      description: >-
        Net grid-fee component in ct/kWh that the original contract price sheet
        says is already included in the gross energy price. The report replaces
        this baseline with the applicable VNB grid fee; it does not add the full
        grid fee again. Optional: when blank, the integration selects the normal
        basis_rate_net_ct_per_kwh for each agreement's validFrom date from the
        matching local grid-fee schedule. The file must reflect the original
        contract's embedded network-fee component; otherwise enter it manually.
        For §14a EnWG calculations, the effective grid-fee schedule is selected
        using the declared Module 3 date and the VNB data/manual rates below.
        Regulatory context: BNetzA BK6-22-300 and BK8-22/010-A; this input alone
        does not establish eligibility or enrollment.
      required: false
      selector:
        number:
          min: 0
          max: 100
          step: 0.01
          mode: box
    module3_start_date:
      name: Module 3 effective date
      description: Date from which you declared or selected Module 3 for this metering point; falls back to module3_start_date in the matching user schedule file. The API module label alone does not determine applicability.
      required: false
      selector:
        date:
    module3_rates_json:
      name: Manual Module 3 grid-fee rates
      description: Optional manual hourly rates; the prefilled 2025 example is only used for its matching network operator. A matching user schedule file at /config/octopus_germany/grid_fee_schedules.json replaces that prefill. Explicit API rates take precedence; entered JSON rates fill gaps before file rates. Set module3_start_date for the declared/selected effective date when the API does not report MODULE_3. Times are local; valid_to is exclusive. Unavailable rates fall back to API STANDARD and are reported as warnings.
      required: false
      default: >-
        [{"rate_type":"OFFPEAK","start_time":"23:00:00","end_time":"06:00:00","rate_cents_per_kwh":1.99,"valid_from":"2025-04-01T00:00:00+02:00","valid_to":"2026-01-01T00:00:00+01:00"},{"rate_type":"STANDARD","start_time":"06:00:00","end_time":"11:00:00","rate_cents_per_kwh":6.64,"valid_from":"2025-04-01T00:00:00+02:00","valid_to":"2026-01-01T00:00:00+01:00"},{"rate_type":"OFFPEAK","start_time":"11:00:00","end_time":"15:00:00","rate_cents_per_kwh":1.99,"valid_from":"2025-04-01T00:00:00+02:00","valid_to":"2026-01-01T00:00:00+01:00"},{"rate_type":"STANDARD","start_time":"15:00:00","end_time":"17:00:00","rate_cents_per_kwh":6.64,"valid_from":"2025-04-01T00:00:00+02:00","valid_to":"2026-01-01T00:00:00+01:00"},{"rate_type":"PEAK","start_time":"17:00:00","end_time":"22:00:00","rate_cents_per_kwh":12.75,"valid_from":"2025-04-01T00:00:00+02:00","valid_to":"2026-01-01T00:00:00+01:00"},{"rate_type":"STANDARD","start_time":"22:00:00","end_time":"23:00:00","rate_cents_per_kwh":6.64,"valid_from":"2025-04-01T00:00:00+02:00","valid_to":"2026-01-01T00:00:00+01:00"}]
      selector:
        text:
    module1_start_date:
      name: Module 1 eligibility date
      description: Optional date from which to prorate the annual Module 1 credit; falls back to module1_start_date in the matching user schedule file.
      required: false
      selector:
        date:
    module1_annual_credit_net_eur:
      name: Module 1 annual credit (net)
      description: Optional net annual Module 1 credit for the selected report year. Explicit values, including zero, take precedence. When left empty, a matching user schedule file is used; if neither provides a value, it remains unset and no credit is applied.
      required: false
      selector:
        number:
          min: 0
          max: 500
          step: 0.01
          mode: box
    vat_percent:
      name: VAT percentage
      description: Fallback VAT when a tariff price tier provides no VAT rate
      required: true
      default: 19
      selector:
        number:
          min: 0
          max: 100
          step: 0.1
          mode: box
    filename:
      name: Filename
      description: Optional cost CSV filename or package base name saved under /config/octopus_germany/exports
      required: false
      selector:
        text:

submit_meter_readings:
  name: Submit Meter Readings
  description: Submit one or more electricity or gas meter readings to the OE API. Use either a JSON array of readings or the single-reading helper fields. Results are returned in the service response and as event `octopus_germany_meter_readings_submission_result`.
  fields:
    account_number:
      name: Account Number
      description: The account number that owns the meter
      required: true
      example: "A-12345678"
      selector:
        text:
    meter_type:
      name: Meter Type
      description: Select electricity or gas to route the reading to the correct OE mutation
      required: true
      selector:
        select:
          options:
            - "electricity"
            - "gas"
    meter_id:
      name: Meter ID
      description: The OE meter ID (available on the meter entity attributes)
      required: true
      example: "1234567890"
      selector:
        text:
    reading_date:
      name: Reading Date
      description: Date the reading applies to (YYYY-MM-DD)
      required: true
      example: "2026-06-01"
      selector:
        date:
    readings_json:
      name: Readings JSON
      description: Optional JSON array of readings. Each item must contain value and register_obis_code. If provided, this takes precedence over the single-reading fields below.
      required: false
      example: '[{"value": 1234.56, "register_obis_code": "1-0:1.8.0"}]'
      selector:
        text:
    reading_value:
      name: Reading Value
      description: Optional single reading value for a one-register submission
      required: false
      example: 1234.56
      selector:
        number:
          min: 0
          max: 1000000000
          mode: box
    register_obis_code:
      name: Register OBIS Code
      description: Optional OBIS code used with reading_value for single-reading submissions
      required: false
      example: "1-0:1.8.0"
      selector:
        text:
